<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Plataforma FC 3D</title>
<style>
:root{--bg:#f2f1ee;--ink:#141416;--mute:#696b70;--acc:#a8834d;--card:#fff;--line:#dedcd7;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121315;--ink:#f0efec;--mute:#a2a4a8;--acc:#c9a66b;--card:#1a1b1e;--line:#2c2d31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121315;--ink:#f0efec;--mute:#a2a4a8;--acc:#c9a66b;--card:#1a1b1e;--line:#2c2d31;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.box{max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.sp{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
small{font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
b{font-size:17px}
p{margin:0;color:var(--mute);font-size:14px}
a{display:inline-block;margin-top:6px;padding:10px 18px;border-radius:99px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600;font-size:14px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.sp{animation:none}}
</style>
</head>
<body>
<div class="box" id="box" role="status" aria-live="polite">
  <div class="sp" id="sp"></div>
  <small>Plataforma FC 3D</small>
  <b id="tt">Carregando conteúdo protegido…</b>
  <p id="ds">Conferindo o seu acesso.</p>
  <a href="./" id="vt" target="_top" hidden>Voltar ao portal</a>
</div>
<script>
/* Carregador da Plataforma FC 3D.
   Os desenhos, imagens e textos de cada linha NÃO ficam neste arquivo público:
   ficam no banco e só são entregues depois do login, para a empresa dona da linha. */
(function(){
  'use strict';
  var SB_URL='https://pawwncmfadzxfahfvhry.supabase.co',SB_KEY='sb_publishable_b0kGoqo85joo3Vb8Xllxhw_VemwaLMs';
  var TOP=(function(){try{return window.top.location.href&&window.top}catch(e){return window}})();
  var id=(new URLSearchParams(location.search).get('c')||'').toLowerCase().replace(/[^a-z0-9-]/g,'');
  var ses=null;try{ses=JSON.parse(localStorage.getItem('fc3d.ses')||'null')}catch(e){}
  function erro(t,d,sair){
    document.getElementById('sp').hidden=true;
    document.getElementById('tt').textContent=t;
    document.getElementById('ds').textContent=d||'';
    document.getElementById('vt').hidden=false;
    if(sair){try{localStorage.removeItem('fc3d.ses')}catch(e){}}
  }

  /* Raio-X + Vídeo Reels (16/11/2026): soma aos comandos que já existem nas tipologias 3D (cortes, desmontar, abrir folha).
     Só entra nas tipologias (as que têm peças PCS); plantas, catálogo e páginas ficam como estão. Nada muda no banco. */
  function raioX(h){
    var mp='window.__fc3d={SC,CAM,VAOS,corte,foca};';
    if(h.indexOf(mp)>=0&&h.indexOf('</body>')>=0){/* plantas das casas: instalação com guindaste + vídeo */
      h=h.replace(mp,'window.__fc3d={SC,CAM,VAOS,corte,foca,R:typeof R!=="undefined"?R:null,CT:typeof CT!=="undefined"?CT:null};');
      var s2='<script src="'+new URL('raiox-fc.js?v=2',location.href).href+'"><\/script><script src="'+new URL('guindaste-fc.js?v=1',location.href).href+'"><\/script><script>('+String(ligaPlanta)+')();<\/script>';
      var j=h.lastIndexOf('</body>');return h.slice(0,j)+s2+h.slice(j);}
    var marca='window.__fc3d={SC,CAM,PCS,secao,passo};';
    if(h.indexOf(marca)<0||h.indexOf('</body>')<0)return h;
    h=h.replace(marca,'window.__fc3d={SC,CAM,PCS,secao,passo,R:typeof R!=="undefined"?R:null,CT:typeof CT!=="undefined"?CT:null,ROOT:typeof ROOT!=="undefined"?ROOT:null};');
    var src=new URL('raiox-fc.js?v=2',location.href).href;
    var cfg='<script src="'+src+'"><\/script><script>('+String(ligaRaioX)+')();<\/script>';
    var i=h.lastIndexOf('</body>');return h.slice(0,i)+cfg+h.slice(i);
  }
  function ligaPlanta(){
    function go(){var F=window.__fc3d;if(!F||!F.R||!F.CT||!window.FCRaioX||!window.FCGuindaste)return setTimeout(go,300);
      var T=window.THREE,$=function(s){return document.querySelector(s)};
      var tit=(($('.tt b')||{}).textContent||document.title).trim();
      var slug=tit.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
      var alvos=function(){return (F.VAOS||[]).filter(function(v){return v.esq&&v.esq.root&&v.esq.root.parent}).map(function(v){
        return {obj:v.esq.root,fora:new T.Vector3(0,0,-1),chao:v.g.getWorldPosition(new T.Vector3()).y,solo:0,nome:((v.esq.typ&&v.esq.typ.nome)||'Esquadria')+' · '+(v.id||'')}})};
      var escolhe=function(l){var tg=F.CT.target,best=l[0],d=1e9;l.forEach(function(a){var p=a.obj.getWorldPosition(new T.Vector3()),dd=p.distanceTo(tg);if(dd<d){d=dd;best=a}});return best};
      var em3d=function(){var b=$('#v3d');if(b&&!b.classList.contains('on')){b.click();return new Promise(function(r){setTimeout(r,1500)})}};
      var tools=$('header .tools'),pres=$('#bPres');
      var G=FCGuindaste.init({SC:F.SC,CAM:F.CAM,CT:F.CT,alvos:alvos,escolhe:escolhe,antesDe:em3d,barra:tools,cls:'bt',antes:pres,legendaEm:document.body,
        semAlvo:function(){alert('Coloque uma esquadria num vão para ver a instalação.')}});
      FCRaioX.init({R:F.R,SC:F.SC,CAM:F.CAM,CT:F.CT,semRaioX:true,barra:tools,cls:'bt',antes:pres,fundo:'#0f1012',arquivo:'otimizza-'+slug,
        marca:{l1:'OTIMIZZA HS-32',l2:'FELD Perfis de Alumínio · perfis reais do catálogo',l3:'Plataforma desenvolvida por FC Consultoria em Esquadria'},
        roteiro:function(a){var L=[];
          L.push({d:3,cap:tit,fn:function(a){a.clica('#vCasa');a.clica('#v3d');a.orbita(.6)}});
          if(alvos().length)L.push({d:11,cap:'Instalação com guindaste',fn:function(a){a.orbita(0);G.instalaAtual()}});
          if(a.existe('#vRx'))L.push({d:4,cap:'Estrutura raio-x: os perfis dentro da obra',fn:function(a){a.clica('#vRx');a.orbita(.7)}});
          if(a.existe('#iHr'))L.push({d:4,cap:'No fim de tarde',fn:function(a){a.clica('#vCasa');a.desliza('#iHr',17.5,19.25,3.5)}});
          L.push({d:3.6,cap:'Esquadrias Otimizza HS-32',fn:function(a){a.desliza('#iHr',19.25,17.5,2.5);a.orbita(.8)}});
          return L},
        aoTerminar:function(a){a.clica('#vCasa');var r=$('#iHr');if(r){r.value=17.5;r.dispatchEvent(new Event('input',{bubbles:true}))}}});}
    go();
  }
  function ligaRaioX(){
    function go(){var F=window.__fc3d;if(!F||!F.R||!window.FCRaioX)return setTimeout(go,300);
      var tit=((document.querySelector('.tt b')||{}).textContent||document.title).trim();
      var slug=tit.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
      var temA=function(){return !!document.querySelector('#iA')};
      FCRaioX.init({R:F.R,SC:F.SC,CAM:F.CAM,CT:F.CT,alvo:function(){return F.ROOT||F.SC},
        barra:document.querySelector('.tb'),cls:'bt',antes:document.getElementById('bFs'),
        fundo:'#0f1012',arquivo:'otimizza-'+slug,
        marca:{l1:'OTIMIZZA HS-32',l2:'FELD Perfis de Alumínio · seção real do catálogo',l3:'Plataforma desenvolvida por FC Consultoria em Esquadria'},
        roteiro:function(a){var c=document.querySelectorAll('.tb [data-c]'),n=c.length,L=[];
          L.push({d:3.2,cap:tit,fn:function(a){a.clica('.tb [data-v="ext"]');a.orbita(1)}});
          if(a.existe('#bExp'))L.push({d:3.6,cap:'Desmontada: cada perfil no seu lugar',fn:function(a){a.orbita(.6);a.clica('#bExp')}},{d:2.4,cap:'E montada de novo',fn:function(a){a.clica('#bExp')}});
          L.push({d:4,cap:'Raio-X: a esquadria por dentro',fn:function(a){a.raiox(1);a.orbita(1)}});
          if(n){L.push({d:3.8,cap:'Corte real do catálogo',fn:function(a){a.orbita(0);a.raiox(0);a.clica('.tb [data-c]',0)}});
            if(n>1)L.push({d:3.8,cap:'Outra seção, outro detalhe',fn:function(a){a.clica('.tb [data-c]',n-1)}});
            L.push({d:.5,cap:'',fn:function(){var on=document.querySelector('.tb [data-c].on');on&&on.click()}});}
          if(temA())L.push({d:4,cap:'Abrindo a folha',fn:function(a){a.desliza('#iA',0,100,3)}});
          if(a.existe('.tb [data-v="int"]'))L.push({d:3.4,cap:'Vista interna',fn:function(a){a.clica('.tb [data-v="int"]');a.orbita(.5)}});
          L.push({d:3.6,cap:'Esquadrias Otimizza HS-32',fn:function(a){if(temA())a.desliza('#iA',100,0,2);a.raiox(1);a.orbita(.8)}});
          return L},
        aoTerminar:function(a){a.raiox(0);var on=document.querySelector('.tb [data-c].on');on&&on.click();var r=document.querySelector('#iA');if(r&&+r.value){r.value=0;r.dispatchEvent(new Event('input',{bubbles:true}))}a.clica('.tb [data-v="ext"]')}
      });}
    go();
  }
  if(!ses||!ses.token){TOP.location.replace(new URL('./',location.href).href);return}
  if(!id){erro('Abra pelo portal','Escolha a entrega no portal para ver em 3D.');return}
  fetch(SB_URL+'/rest/v1/rpc/fc3d_conteudo',{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({p_token:ses.token,p_id:id})
  }).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
  .then(function(x){
    if(!x.ok){
      var m=(x.j&&x.j.message)||'Não foi possível abrir.';
      if(/Sessão expirada|Acesso pausado|Licença pausada/.test(m)){erro('Acesso encerrado',m,true);setTimeout(function(){TOP.location.replace(new URL('./',location.href).href)},2500);return}
      erro('Não foi possível abrir',m);return;
    }
    if(typeof x.j!=='string'||x.j.length<100){erro('Conteúdo indisponível','Fale com a FC Consultoria.');return}
    document.open();document.write(raioX(x.j));document.close();
  }).catch(function(){erro('Sem conexão','Verifique a internet e tente de novo.')});
})();
</script>
</body>
</html>
