<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Empresas e acessos · FC 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Plataforma FC 3D Clientes · Empresas e acessos (só a FC Consultoria).
   © FC Consultoria em Esquadria */
:root{--bg:#f3f5f4;--panel:#fff;--soft:#eaf0ee;--ink:#10201f;--mute:#5a6b69;--line:#d5dfdc;--teal:#0e6f6a;--teal2:#0a4f4b;--tealSoft:#dcefec;
  --amberSoft:#fbefd6;--amberInk:#8a5a08;--ok:#1f7a48;--okSoft:#dff2e6;--red:#b42318;--redSoft:#fde8e6;
  --f-h:'Space Grotesk',system-ui,sans-serif;--f-b:'Inter',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1514;--panel:#142120;--soft:#1a2b29;--ink:#e6efed;--mute:#97aaa7;--line:#263936;--teal:#3cc0b5;--teal2:#2a9d93;--tealSoft:#163a37;--amberSoft:#3a2d12;--amberInk:#f0c87a;--ok:#6fd39a;--okSoft:#173523;--red:#ff8a80;--redSoft:#3a1714;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1514;--panel:#142120;--soft:#1a2b29;--ink:#e6efed;--mute:#97aaa7;--line:#263936;--teal:#3cc0b5;--teal2:#2a9d93;--tealSoft:#163a37;--amberSoft:#3a2d12;--amberInk:#f0c87a;--ok:#6fd39a;--okSoft:#173523;--red:#ff8a80;--redSoft:#3a1714;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-b)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-h);margin:0;letter-spacing:-.01em}p{margin:0}[hidden]{display:none!important}
.mute{color:var(--mute)}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
header h1{font-size:24px}header .sp{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--teal)}.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}.btn.pri:hover{background:var(--teal2)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}.btn.red{color:var(--red)}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--mute);white-space:nowrap}
.chip.o{background:var(--okSoft);color:var(--ok)}.chip.a{background:var(--amberSoft);color:var(--amberInk)}.chip.r{background:var(--redSoft);color:var(--red)}.chip.t{background:var(--tealSoft);color:var(--teal)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kpi b{display:block;font:700 26px var(--f-h)}
.atal{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.emp{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.emp.off{opacity:.72}
.eh{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.sig{width:42px;height:42px;border-radius:10px;background:var(--tealSoft);color:var(--teal);display:grid;place-items:center;font:700 15px var(--f-h)}
.eh h2{font-size:18px}.eh .sp{flex:1}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:600}tr:last-child td{border-bottom:0}
td .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.vazio{padding:14px 16px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:9}
.box{background:var(--panel);border-radius:14px;max-width:520px;width:100%;padding:18px;max-height:92vh;overflow:auto}
.box h3{font-size:19px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px}
textarea{min-height:150px;resize:vertical;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.msg{color:var(--red);font-size:14px;margin-top:8px;min-height:1em}
.cod{font:700 26px var(--f-h);letter-spacing:.12em;background:var(--tealSoft);color:var(--teal);border-radius:10px;padding:10px 14px;text-align:center;margin:6px 0}
.gate{max-width:440px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center}
.gate p{margin:8px 0 16px}
.nota{font-size:13px;color:var(--mute);margin-top:6px}
@media(max-width:640px){th:nth-child(3),td:nth-child(3){display:none}th,td{padding:8px 10px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden><h2>Só a FC Consultoria</h2><p class="mute">Entre na plataforma com o <b>Acesso FC</b> e volte para esta página.</p><a class="btn pri" href="../">Ir para a plataforma</a></div>
<div class="wrap" id="app" hidden>
 <header><h1>Empresas e acessos</h1><span class="chip t">Plataforma FC 3D</span><span class="sp"></span><a class="btn" href="../">← Plataforma</a><button class="btn pri" id="btNova">＋ Nova empresa</button></header>
 <div class="kpis" id="kpis"></div>
 <div class="atal" id="atal"></div>
 <div id="lista"><p class="mute">Carregando…</p></div>
</div>
<div class="dlg" id="dlg" hidden><div class="box" id="box" role="dialog" aria-modal="true"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=window.supabase.createClient('https://pawwncmfadzxfahfvhry.supabase.co','sb_publishable_b0kGoqo85joo3Vb8Xllxhw_VemwaLMs',{auth:{persistSession:false,storageKey:'pfc-auth'}});
const $=s=>document.querySelector(s);
const h=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOK=null;try{TOK=localStorage.getItem('pfc-token')}catch(_){}
async function rpc(fn,a){const r=await sb.rpc(fn,Object.assign({p_token:TOK},a||{}));if(r.error)throw new Error(r.error.message);return r.data;}
const LINK='https://fc-consultoria.github.io/fc3d/clientes/';
const PAP={gestor:'Gestor',vendedor:'Colaborador',arquiteto:'Portal do Cliente'};
const SUG=[['casa-bandeirante','Casa Bandeirante','CB'],['guapore-vidros','Guaporé Vidros','GV'],['guapore-sinop','Guaporé Sinop','GS'],['cde','CDE Vidros & Esquadrias','CDE']];
let L=[];
const dataBR=d=>d?d.split('-').reverse().join('/'):'';
const umAno=()=>{const d=new Date();d.setFullYear(d.getFullYear()+1);return d.toISOString().slice(0,10);};
function situ(e){
  if(!e.ativo)return ['Pausada','r'];
  if(!e.licenca_ate)return ['Sem validade','a'];
  const dias=Math.ceil((new Date(e.licenca_ate+'T23:59:59')-new Date())/864e5);
  if(dias<0)return ['Vencida','r'];if(dias<=30)return ['Vence em '+dias+' dia'+(dias===1?'':'s'),'a'];return ['Ativa até '+dataBR(e.licenca_ate),'o'];}
function quando(t){if(!t)return 'nunca entrou';const d=new Date(t),m=Math.round((Date.now()-d)/6e4);if(m<60)return 'há '+Math.max(m,1)+' min';if(m<1440)return 'há '+Math.round(m/60)+' h';return d.toLocaleDateString('pt-BR');}

async function iniciar(){
  try{const s=TOK&&await sb.rpc('pfc_sessao',{p_token:TOK});if(!s||s.error||!s.data.matriz)throw 0;}catch(_){$('#gate').hidden=false;return;}
  $('#app').hidden=false;carregar();}
async function carregar(){
  try{L=await rpc('pfc_adm_lista');}catch(e){$('#lista').innerHTML='<p class="msg">'+h(e.message)+'</p>';return;}
  const pes=L.flatMap(e=>e.acessos),ativ=L.filter(e=>situ(e)[1]==='o').length;
  $('#kpis').innerHTML=[['Empresas',L.length],['Licenças ativas',ativ],['Pessoas',pes.length],['Já entraram',pes.filter(p=>p.ultimo).length]].map(([n,v])=>`<div class="kpi"><span class="mute">${n}</span><b>${v}</b></div>`).join('');
  const falta=SUG.filter(s=>!L.some(e=>e.id===s[0]));
  $('#atal').hidden=!falta.length;
  $('#atal').innerHTML='<span class="mute">Cadastrar rápido:</span>'+falta.map(s=>`<button class="btn sm" data-sug="${s[0]}">＋ ${h(s[1])}</button>`).join('');
  $('#atal').querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{const s=SUG.find(x=>x[0]===b.dataset.sug);formEmp({id:s[0],nome:s[1],sigla:s[2],ativo:true,licenca_ate:umAno(),novo:1});});
  $('#lista').innerHTML=L.length?L.map(e=>{const [st,c]=situ(e);return `<section class="emp ${c==='r'?'off':''}">
   <div class="eh"><div class="sig">${h(e.sigla||e.nome.slice(0,2).toUpperCase())}</div><div><h2>${h(e.nome)}</h2><span class="mute" style="font-size:13px">${h(e.contato||'')}${e.obs?' · '+h(e.obs):''}</span></div><span class="chip ${c}">${st}</span><span class="sp"></span>
   <button class="btn sm" data-ed="${h(e.id)}">✎ Empresa e licença</button><button class="btn sm pri" data-np="${h(e.id)}">＋ Pessoa</button></div>
   ${e.acessos.length?`<table><thead><tr><th>Pessoa</th><th>Papel</th><th>Último acesso</th><th></th></tr></thead><tbody>${e.acessos.map(a=>`<tr>
    <td><b>${h(a.nome)}</b><br><span class="mute" style="font-size:13px">login: ${h(a.login)}</span></td>
    <td><span class="chip ${a.ativo?'t':'r'}">${PAP[a.papel]||a.papel}${a.ativo?'':' · pausado'}</span></td>
    <td class="mute" style="font-size:13px">${quando(a.ultimo)}</td>
    <td><div class="acts"><button class="btn sm" data-cod="${a.id}" title="Gera um código novo e envia de novo">🔑 Novo código</button><button class="btn sm" data-ep="${a.id}">✎</button><button class="btn sm" data-tg="${a.id}">${a.ativo?'⏸ Pausar':'▶ Ativar'}</button><button class="btn sm red" data-del="${a.id}" title="Excluir">🗑</button></div></td></tr>`).join('')}</tbody></table>`:'<p class="vazio mute">Nenhuma pessoa ainda. Comece pelo Gestor da empresa.</p>'}</section>`;}).join(''):'<p class="mute">Nenhuma empresa cadastrada. Use o cadastro rápido acima ou “＋ Nova empresa”.</p>';
  const ach=id=>{for(const e of L){const a=e.acessos.find(x=>x.id===id);if(a)return [e,a];}};
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>formEmp(L.find(e=>e.id===b.dataset.ed)));
  document.querySelectorAll('[data-np]').forEach(b=>b.onclick=()=>formPes(L.find(e=>e.id===b.dataset.np)));
  document.querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>{const [e,a]=ach(b.dataset.ep);formPes(e,a);});
  document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{const [e,a]=ach(b.dataset.tg);await salvarPes(e,a,{nome:a.nome,login:a.login,papel:a.papel,ativo:!a.ativo});});
  document.querySelectorAll('[data-cod]').forEach(b=>b.onclick=async()=>{const [e,a]=ach(b.dataset.cod);
    if(!confirm('Gerar um código novo para '+a.nome+'? O código antigo deixa de funcionar.'))return;
    try{const r=await rpc('pfc_adm_novo_codigo',{p_id:a.id});if(r.erro)return alert(r.erro);mostraCodigo(e,a.nome,r.login,r.codigo);carregar();}catch(err){alert(err.message);}});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const [e,a]=ach(b.dataset.del);
    if(!confirm('Excluir o acesso de '+a.nome+'? Para só bloquear por um tempo, use Pausar.'))return;
    try{await rpc('pfc_adm_acesso_excluir',{p_id:a.id});carregar();}catch(err){alert(err.message);}});
}
function abre(html){$('#box').innerHTML=html;$('#dlg').hidden=false;const f=$('#box').querySelector('input');f&&f.focus();}
function fecha(){$('#dlg').hidden=true;}
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg'||e.target.dataset.x!==undefined)fecha();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecha();});
$('#btNova').onclick=()=>formEmp({ativo:true,licenca_ate:umAno(),novo:1});

function formEmp(e){
  abre(`<h3>${e.novo?'Nova empresa':'Empresa e licença'}</h3>
  <label>Nome da empresa</label><input id="fNome" value="${h(e.nome)}">
  <div class="row"><div><label>Sigla (aparece no topo)</label><input id="fSig" maxlength="4" value="${h(e.sigla)}"></div>
  <div><label>Licença válida até</label><input id="fAte" type="date" value="${h(e.licenca_ate)}"></div></div>
  <label>Contato (nome e WhatsApp)</label><input id="fCon" value="${h(e.contato)}">
  <label>Observação</label><input id="fObs" value="${h(e.obs)}" placeholder="ex.: período junto com o acesso antigo até 30/11">
  <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="fAt" style="width:auto" ${e.ativo!==false?'checked':''}> Empresa ativa (desmarcar pausa todos os acessos dela)</label>
  <p class="msg" id="fMsg"></p>
  <div class="bts"><button class="btn" data-x>Cancelar</button><button class="btn pri" id="fOk">Salvar</button></div>`);
  $('#fOk').onclick=async()=>{try{const r=await rpc('pfc_adm_empresa',{p_id:e.id||'',p_nome:$('#fNome').value,p_sigla:$('#fSig').value,p_licenca_ate:$('#fAte').value||null,p_ativo:$('#fAt').checked,p_contato:$('#fCon').value,p_obs:$('#fObs').value});
    if(r.erro){$('#fMsg').textContent=r.erro;return;}fecha();carregar();}catch(err){$('#fMsg').textContent=err.message;}};
}
const slug=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'');
function formPes(e,a){
  const novo=!a;a=a||{papel:e.acessos.some(x=>x.papel==='gestor')?'vendedor':'gestor',ativo:true};
  abre(`<h3>${novo?'Nova pessoa':'Editar pessoa'} · ${h(e.nome)}</h3>
  <label>Nome</label><input id="pNome" value="${h(a.nome)}">
  <label>Login</label><input id="pLog" value="${h(a.login)}" autocapitalize="off" spellcheck="false">
  <p class="nota">Sugestão: primeiro nome + sigla, como <b>renato.${h(slug(e.sigla||e.id))}</b></p>
  <label>Papel</label><select id="pPap"><option value="gestor" ${a.papel==='gestor'?'selected':''}>Gestor</option><option value="vendedor" ${a.papel==='vendedor'?'selected':''}>Colaborador</option><option disabled>Portal do Cliente (ainda não liberado)</option></select>
  ${novo?'<p class="nota">O código de acesso é gerado na hora e aparece uma vez só, com a mensagem pronta para o WhatsApp.</p>':''}
  <p class="msg" id="pMsg"></p>
  <div class="bts"><button class="btn" data-x>Cancelar</button><button class="btn pri" id="pOk">${novo?'Criar e gerar código':'Salvar'}</button></div>`);
  const nm=$('#pNome'),lg=$('#pLog');let mexeu=!novo;
  lg.oninput=()=>mexeu=true;nm.oninput=()=>{if(!mexeu)lg.value=slug(nm.value.split(' ')[0]||'')+(nm.value?'.'+slug(e.sigla||e.id):'');};
  $('#pOk').onclick=()=>salvarPes(e,novo?null:a,{nome:nm.value,login:lg.value,papel:$('#pPap').value,ativo:a.ativo},$('#pMsg'));
}
async function salvarPes(e,a,v,msg){
  try{const r=await rpc('pfc_adm_acesso',{p_id:a?a.id:null,p_empresa:e.id,p_nome:v.nome,p_login:v.login,p_papel:v.papel,p_ativo:v.ativo});
    if(r.erro){msg?msg.textContent=r.erro:alert(r.erro);return;}
    if(r.codigo)mostraCodigo(e,v.nome,r.login,r.codigo);else fecha();carregar();}
  catch(err){msg?msg.textContent=err.message:alert(err.message);}
}
function mostraCodigo(e,nome,login,cod){
  const txt=`Olá, ${nome.split(' ')[0]}! Seu acesso à Plataforma FC 3D da ${e.nome} está liberado.\n\nLink: ${LINK}\nLogin: ${login}\nCódigo: ${cod}\n\nO acesso é pessoal: não compartilhe o código. Qualquer dúvida, fale com a FC Consultoria.`;
  abre(`<h3>Acesso pronto · ${h(nome)}</h3>
  <p class="mute">Login <b>${h(login)}</b> · código (aparece só agora):</p><div class="cod">${h(cod)}</div>
  <label>Mensagem para enviar</label><textarea id="mTx">${h(txt)}</textarea>
  <div class="bts"><button class="btn" id="mCp">📋 Copiar</button><a class="btn pri" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">💬 Abrir no WhatsApp</a><button class="btn" data-x>Fechar</button></div>`);
  $('#mCp').onclick=async()=>{try{await navigator.clipboard.writeText($('#mTx').value);$('#mCp').textContent='✓ Copiado';}catch(_){$('#mTx').select();}};
}
iniciar();
</script>
</body>
</html>
