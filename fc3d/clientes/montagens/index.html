<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Orientativo 3D FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Orientativo 3D · passo a passo · Plataforma FC 3D Clientes
   Mesmo modelo do Orientativo de Montagem 3D da FC, com linhas FC e códigos SU.
   © FC Consultoria em Esquadria · criação da FC, uso exclusivo de empresas licenciadas. */
:root{
  --bg:#f3f5f4;--panel:#ffffff;--soft:#eaf0ee;--ink:#10201f;--mute:#5a6b69;--line:#d5dfdc;
  --teal:#0e6f6a;--teal2:#0a4f4b;--tealSoft:#dcefec;--amber:#c88a1c;--amberSoft:#fbefd6;--amberInk:#8a5a08;
  --ok:#1f7a48;--okSoft:#dff2e6;--bad:#b3261e;--badSoft:#fbe4e2;--vid:#bfe0ea;--alu:#c4cbcf;--alu2:#8e989d;--parede:#e6a57f;--parede2:#cf8a62;
  --f-h:'Space Grotesk',system-ui,sans-serif;--f-b:'Inter',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1514;--panel:#142120;--soft:#1a2b29;--ink:#e6efed;--mute:#97aaa7;--line:#263936;
  --teal:#3cc0b5;--teal2:#2a9d93;--tealSoft:#163a37;--amber:#e8b04a;--amberSoft:#3a2d12;--amberInk:#f0c87a;--ok:#6fd39a;--okSoft:#173523;--bad:#f28b82;--badSoft:#3b1a18;--vid:#2c5866;--alu:#7d8a90;--alu2:#a9b6bb;--parede:#8a5a43;--parede2:#a56c50;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1514;--panel:#142120;--soft:#1a2b29;--ink:#e6efed;--mute:#97aaa7;--line:#263936;
  --teal:#3cc0b5;--teal2:#2a9d93;--tealSoft:#163a37;--amber:#e8b04a;--amberSoft:#3a2d12;--amberInk:#f0c87a;--ok:#6fd39a;--okSoft:#173523;--bad:#f28b82;--badSoft:#3b1a18;--vid:#2c5866;--alu:#7d8a90;--alu2:#a9b6bb;--parede:#8a5a43;--parede2:#a56c50;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-b)}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-h);margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}
.mute{color:var(--mute)}
a{color:var(--teal)}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:9px 15px;font-weight:600;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}.btn.pri:hover{background:var(--teal2)}
.btn.am{background:var(--amber);border-color:var(--amber);color:#1b1205}
.btn[aria-pressed="true"]{background:var(--tealSoft);border-color:var(--teal);color:var(--teal)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--mute)}
.chip.t{background:var(--tealSoft);color:var(--teal)}.chip.a{background:var(--amberSoft);color:var(--amberInk)}

/* acesso */
.gate{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:var(--bg);padding:16px}
.gate div{max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}
.gate h1{font-size:21px;margin-bottom:8px}

/* topo */
.topo{background:var(--teal2);color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 3px 0 var(--amber)}
.topo .w{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.topo a.volta{color:#fff;text-decoration:none;font-weight:600;font-size:14px;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:7px 12px;white-space:nowrap}
.topo .tt b{display:block;font:700 18px/1.1 var(--f-h)}.topo .tt small{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#f2d79a}
.topo .sp{flex:1}
.prog{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}.prog i{display:block;width:110px;height:8px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}.prog i s{display:block;height:100%;background:var(--amber);transition:width .4s}
.topo button{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:10px;padding:7px 11px;font-weight:600;cursor:pointer;min-height:38px}
@media(max-width:640px){.prog i{width:60px}.topo .tt small{display:none}.topo a.volta{padding:7px 9px}}

/* layout */
.lay{max-width:1280px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.nav{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:3px}
.nav .nh{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:6px 8px}
.nav a{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none}
.nav a:hover{background:var(--soft)}.nav a.on{background:var(--tealSoft);color:var(--teal)}
.nav .n{width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:12px;flex:none}
.nav a.on .n{background:var(--teal);color:#fff}.nav .ck{margin-left:auto;color:var(--ok)}
@media(max-width:900px){.lay{grid-template-columns:1fr}.nav{position:static;flex-direction:row;overflow-x:auto;padding:6px}.nav a{flex:none}.nav .nh{display:none}}

/* conteúdo */
.hero{background:radial-gradient(circle at 20% 10%,#1b8f87,#0b4a46 55%,#06211f);color:#fff;border-radius:18px;padding:30px}
.hero .ey{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#f2d79a;font-weight:700}
.hero h1{font-size:clamp(28px,4vw,40px);line-height:1.08;margin:8px 0 12px}
.hero p{color:#cfe9e5;max-width:62ch}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:16px}
.mc{appearance:none;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;display:flex;gap:12px;cursor:pointer;align-items:flex-start}
.mc:hover{border-color:var(--teal)}.mc .n{width:34px;height:34px;border-radius:10px;background:var(--tealSoft);color:var(--teal);display:grid;place-items:center;font-weight:700;flex:none}
.mc.ok .n{background:var(--okSoft);color:var(--ok)}.mc b{display:block;font-family:var(--f-h)}.mc small{color:var(--mute);font-size:13px;line-height:1.4;display:block;margin-top:2px}
.mh{margin-bottom:14px}.mh .ey{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--amberInk);font-weight:700}
.mh h1{font-size:clamp(24px,3vw,32px);margin:4px 0 6px}.mh p{color:var(--mute)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.sec h2{font-size:19px;margin-bottom:6px}.sec .nt{color:var(--mute);font-size:14px;margin-bottom:10px}
.dica{background:var(--amberSoft);color:var(--amberInk);border-radius:12px;padding:10px 13px;font-size:14px;margin-top:12px}
.aviso{font-size:12.5px;color:var(--mute);margin-top:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.fig{background:var(--soft);border-radius:14px;padding:12px;display:grid;place-items:center}
.fig svg{width:100%;height:auto;max-height:360px;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slider{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:600;font-size:14px}.slider input{flex:1;accent-color:var(--teal)}

/* tipologias */
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tp{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.tp:hover,.tp[aria-pressed="true"]{border-color:var(--teal)}.tp[aria-pressed="true"]{box-shadow:0 0 0 2px var(--tealSoft)}
.tp .d{background:var(--soft);border-radius:10px;padding:10px;height:110px;display:grid;place-items:center}.tp .d svg{max-height:90px;width:auto;max-width:100%;color:var(--ink)}
.tp b{font-family:var(--f-h);font-size:14px;line-height:1.25}
.tdet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;margin-top:14px;align-items:center}
.tdet .d{background:var(--soft);border-radius:14px;padding:16px;display:grid;place-items:center}.tdet .d svg{max-height:230px;width:auto;max-width:100%;color:var(--ink)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0}dt{color:var(--mute);font-size:13px}dd{margin:0;font-weight:600;font-size:14px}
@media(max-width:700px){.tdet{grid-template-columns:1fr}}

/* passos */
.passos{display:grid;gap:6px}
.ps{appearance:none;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:9px 11px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
.ps span{width:24px;height:24px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font-size:12px;flex:none}
.ps.on{border-color:var(--teal);background:var(--tealSoft);color:var(--teal)}.ps.on span{background:var(--teal);color:#fff}
.ps.feito span{background:var(--okSoft);color:var(--ok)}
.pstx{margin-top:10px;font-size:14.5px}

/* peças */
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pc{appearance:none;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.pc:hover,.pc.on{border-color:var(--teal)}.pc.on{background:var(--tealSoft)}
.pc b{font-family:var(--f-h);color:var(--teal)}.pc span{font-size:13.5px;font-weight:600}.pc small{color:var(--mute);font-size:12.5px}
.pcmini{display:block;height:46px;margin-bottom:4px}.pcmini svg{height:100%;width:auto;color:var(--ink)}

/* 3D */
.v3w{position:relative;border-radius:14px;overflow:hidden;background:#0f1a19}
.v3w.fs{position:fixed;inset:0;z-index:900;border-radius:0}
.v3{height:500px}.v3w.fs .v3{height:100vh}
.v3 canvas{display:block;touch-action:none}
.v3msg{position:absolute;inset:0;display:grid;place-items:center;color:#a9c2be;font-weight:600}
.v3bar{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.v3bar>*{pointer-events:auto}
.v3bar .btn{min-height:36px;padding:6px 11px;font-size:13.5px;background:rgba(20,33,32,.86);color:#fff;border-color:rgba(255,255,255,.18)}
.v3bar .btn[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.v3bar .med{display:flex;gap:6px;align-items:center;background:rgba(20,33,32,.86);border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:4px 8px;color:#dff3f0;font-size:13px}
.v3bar .med input{width:68px;border:0;border-radius:7px;padding:4px 6px;color:#10201f;text-align:right;background:#fff}
.v3lb{position:absolute;left:10px;bottom:10px;right:10px;background:rgba(20,33,32,.9);color:#fff;border-radius:11px;padding:8px 12px;font-size:14px}
.v3lb b{color:#f2c063}
.v3w.v3cl .v3dica{color:#5a6b69}
.v3cor{position:absolute;right:10px;top:58px;width:min(300px,calc(100% - 20px));background:rgba(20,33,32,.94);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 12px;color:#dff3f0;font-size:13px;display:grid;gap:8px;z-index:3}
.v3cor b{font-weight:600;display:block;margin-bottom:4px}.v3cor .sw{display:flex;gap:6px;flex-wrap:wrap}
.v3cor button{width:30px;height:30px;border-radius:9px;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.v3cor button[aria-pressed="true"]{border-color:#f2c063;box-shadow:0 0 0 2px #f2c063}
.v3dica{position:absolute;right:12px;bottom:12px;color:#8fb3ad;font-size:12px}

/* quiz */
.qz{display:grid;gap:12px}
.q{border:1px solid var(--line);border-radius:12px;padding:12px}
.q p{font-weight:600;margin-bottom:8px}
.op{display:flex;flex-direction:column;gap:6px}
.op button{appearance:none;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;cursor:pointer}
.op button:hover{border-color:var(--teal)}
.op button.certo{background:var(--okSoft);border-color:var(--ok);color:var(--ok);font-weight:600}
.op button.errado{background:var(--badSoft);border-color:var(--bad);color:var(--bad)}
.ex{margin-top:8px;font-size:14px;color:var(--mute)}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px}
.res{font:700 44px var(--f-h);color:var(--teal)}

@keyframes pisca{0%,100%{opacity:1}50%{opacity:.35}}
.anim{transition:transform .9s cubic-bezier(.5,0,.2,1)}
</style>
</head>
<body>
<div class="gate" id="gate"><div><h1 id="gateT">Abrindo o Orientativo…</h1><p class="mute" id="gateP">Conferindo o seu acesso.</p></div></div>

<header class="topo"><div class="w">
  <a class="volta" href="../#tip">← Tipologias</a>
  <div class="tt"><small>Plataforma FC 3D · Tipologias</small><b>Montagens 3D · Linha Suprema</b></div>
  <span class="sp"></span>
  <div class="prog" title="Módulos estudados"><i><s id="pgB" style="width:0"></s></i><span id="pgT">0/9</span></div>
  <button type="button" id="btTema" aria-label="Trocar fundo claro ou escuro" title="Claro / escuro"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
  <button type="button" id="bHome">☰ Início</button>
</div></header>
<div class="lay"><nav class="nav" id="nav" aria-label="Módulos"></nav><main id="main"><p style="padding:30px">Carregando…</p></main></div>

<script src="../tecnico/montagens.js?v=1"></script>
<script>
(function(){
/* ---------- acesso: só com a sessão da Plataforma FC 3D Clientes (gestor e vendedor) ---------- */
const SP='https://pawwncmfadzxfahfvhry.supabase.co/rest/v1/rpc/pfc_sessao',SPK='sb_publishable_b0kGoqo85joo3Vb8Xllxhw_VemwaLMs';
const LSg=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(_){return d}},LSs=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}};
let tk=null;try{tk=localStorage.getItem('pfc-token');}catch(_){}
function nega(t,p){document.getElementById('gateT').textContent=t;document.getElementById('gateP').innerHTML=p+'<br><br><a href="../">Ir para a Plataforma FC 3D</a>';}
if(!tk){nega('Entre na Plataforma FC 3D','O Orientativo abre pela plataforma, depois de entrar com o seu login.');return;}
fetch(SP,{method:'POST',headers:{apikey:SPK,'Content-Type':'application/json'},body:JSON.stringify({p_token:tk})})
 .then(r=>r.ok?r.json():null).then(d=>{
   if(!(d&&(d.papel||d.matriz))){nega('Sessão encerrada','Entre de novo na Plataforma FC 3D.');return;}
   
   document.getElementById('gate').hidden=true;iniciar();})
 .catch(()=>nega('Sem conexão','Confira a internet e abra de novo.'));

/* ---------- tema (o mesmo da plataforma) ---------- */
const TM='fc3d-cli-tema';
function tema(m){if(m)document.documentElement.setAttribute('data-theme',m);else document.documentElement.removeAttribute('data-theme');}
try{tema(localStorage.getItem(TM));}catch(_){}
document.getElementById('btTema').onclick=()=>{const a=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');const n=a==='dark'?'light':'dark';tema(n);try{localStorage.setItem(TM,n)}catch(_){}};

const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kg=n=>n==null?'—':n.toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3});
let SEC=null;/* seções FC da janela de correr 2 folhas (as mesmas do desenho técnico) */

/* ---------- módulos (a mesma sequência do Orientativo de Montagem 3D) ---------- */
const MOD=[
 {id:'tip',n:'Tipologias',d:'Os modelos de janelas, portas e fachadas e como cada um abre'},
 {id:'cm',n:'Contramarco',d:'O que é, os componentes e a instalação passo a passo'},
 {id:'gua',n:'Guarnições',d:'Por que a guarnição muda com a espessura do vidro'},
 {id:'cor',n:'Janelas de Correr',d:'A janela 2 folhas em 3D com os perfis reais, e as de 3, 4 e 6 folhas'},
 {id:'max',n:'Janela Maxim-Ar',d:'Como abre e como se escolhe o braço'},
 {id:'pad',n:'Perfis e Componentes Padrão',d:'O que se repete em janela e porta, e o trilho macarrão'},
 {id:'giro',n:'Porta de Giro',d:'Como abre e a montagem a 90° e a 45°'},
 {id:'div',n:'Perfis Diversos',d:'Lambris e venezianas'},
 {id:'fac',n:'Fachadas',d:'Fachada Cortina e Pele de Vidro Atlanta em 3D'}];
let FEITO=new Set(LSg('pfc-ori-feito',[])),AT=null,V3=null;

function navUI(){$('#nav').innerHTML='<div class="nh">Sequência do passo a passo</div>'+MOD.map((m,k)=>`<a data-go="${m.id}" class="${AT===m.id?'on':''}"><span class="n">${String(k+1).padStart(2,'0')}</span>${esc(m.n)}${FEITO.has(m.id)?'<span class="ck">✓</span>':''}</a>`).join('')+`<a data-go="quiz" class="${AT==='quiz'?'on':''}"><span class="n">✓</span>Prova final</a>`;
 $('#pgB').style.width=(FEITO.size/MOD.length*100)+'%';$('#pgT').textContent=FEITO.size+'/'+MOD.length;}
function head(k,sub){const m=MOD[k];return `<div class="mh"><div class="ey">Módulo ${String(k+1).padStart(2,'0')} · ${esc(m.n)}</div><h1>${esc(sub||m.n)}</h1><p>${esc(m.d)}</p></div>`;}
function foot(k){const a=MOD[k-1],b=MOD[k+1],f=FEITO.has(MOD[k].id);return `<div class="foot">${a?`<button class="btn" data-go="${a.id}">← ${esc(a.n)}</button>`:'<span></span>'}<button class="btn ${f?'':'am'}" data-feito="${MOD[k].id}">${f?'✓ Módulo estudado':'✔ Marcar como estudado'}</button>${b?`<button class="btn pri" data-go="${b.id}">${esc(b.n)} →</button>`:`<button class="btn pri" data-go="quiz">Prova final →</button>`}</div>`;}
function quiz(qs,tit){qs=qs.map((q,i)=>{const o=q[1].map((t,j)=>[t,j]);for(let k=o.length-1;k>0;k--){const r=(i*7+k*3+q[0].length)%(k+1);[o[k],o[r]]=[o[r],o[k]];}return [q[0],o.map(x=>x[0]),o.findIndex(x=>x[1]===q[2]),q[3]];});
 return `<div class="sec"><h2>✍️ ${tit||'Teste rápido'}</h2><p class="nt">Toque na resposta. Errou? A explicação aparece logo abaixo.</p><div class="qz">${qs.map((q,i)=>`<div class="q" data-r="${q[2]}"><p>${i+1}. ${esc(q[0])}</p><div class="op">${q[1].map((o,j)=>`<button type="button" data-o="${j}">${esc(o)}</button>`).join('')}</div><div class="ex" hidden>${esc(q[3]||'')}</div></div>`).join('')}</div></div>`;}

/* ---------- desenhos esquemáticos (elevação, sem escala) ---------- */
const S='stroke="currentColor" fill="none" stroke-width="3" stroke-linejoin="round"',VV='fill="currentColor" fill-opacity=".07"';
const seta=(x1,y,x2)=>`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="currentColor" stroke-width="2.5"/><path d="M${x2} ${y} l${x2>x1?-8:8} -6 v12z" fill="currentColor"/>`;
function desenho(id){let w=200,ht=150,b='';

 :`<svg viewBox="0 0 160 160" role="img" aria-label="Canto a 45 graus"><path d="M20 20 H140 V50 H50 Z" fill="var(--alu)" stroke="var(--alu2)" stroke-width="2"/><path d="M20 20 L50 50 V140 H20 Z" fill="var(--alu)" stroke="var(--alu2)" stroke-width="2"/><path d="M28 34 h18 v-6 M34 28 v18" stroke="var(--amber)" stroke-width="4" fill="none"/><text x="66" y="100" font-size="13" fill="currentColor">meia-esquadria</text></svg>`;}
function mGiro(){return head(6,'Porta de Giro')+`<div class="sec"><h2>🚪 Como a porta de giro abre</h2><p class="nt">A porta de giro abre girando nas dobradiças. Arraste para abrir.</p>
 <div class="grid2"><div><div class="fig" id="grFig">${giroSvg(GA)}</div><label class="slider">Abertura <input type="range" min="0" max="90" value="${GA}" id="grR"> <span id="grT">${GA}°</span></label></div>
 <div><h3>Montagem a 90° e a 45°</h3><div class="grid2" style="margin-top:10px"><div class="fig">${cantoSvg(90)}<b>90°</b><small class="mute">Corte reto, unido com parafuso</small></div><div class="fig">${cantoSvg(45)}<b>45°</b><small class="mute">Meia-esquadria, unida com cantoneira e cunha</small></div></div>
 <p class="dica">💡 A folha pode ser toda de vidro, com lambril, com veneziana, ou vidro em cima e lambril ou veneziana embaixo.</p></div></div></div>`+
 quiz([['Na porta de giro 45°, como os cantos são unidos?',['Meia-esquadria com cantoneira e cunha','Corte reto com parafuso','Só com a dobradiça'],0,'No 45° (meia-esquadria) entra cantoneira e cunha; no 90°, corte reto e parafuso.'],
  ['Onde a porta de giro gira?',['Nas dobradiças','No trilho','Nos braços'],0,'A porta de giro abre girando nas dobradiças.']])+foot(6);}

/* =========================== 08 · Diversos =========================== */
function divSvg(t){return t==='lam'?`<svg viewBox="0 0 220 150" role="img" aria-label="Lambril, corte"><rect x="10" y="20" width="200" height="110" fill="var(--alu)" fill-opacity=".35" stroke="var(--alu2)" stroke-width="2"/>${[0,1,2,3,4].map(i=>`<rect x="${14+i*39}" y="24" width="36" height="102" fill="var(--alu)" stroke="var(--alu2)" stroke-width="1.5"/>`).join('')}<text x="110" y="146" text-anchor="middle" font-size="12" fill="currentColor">fechado: privacidade</text></svg>`
 :`<svg viewBox="0 0 220 150" role="img" aria-label="Veneziana, corte"><rect x="10" y="10" width="200" height="120" fill="none" stroke="var(--alu2)" stroke-width="3"/>${[0,1,2,3,4,5].map(i=>`<path d="M14 ${22+i*18} L206 ${12+i*18}" stroke="var(--alu2)" stroke-width="7"/>`).join('')}<path d="M40 70 h50" stroke="var(--teal)" stroke-width="2.5" stroke-dasharray="4 4"/><path d="M90 70 l-8 -5 v10z" fill="var(--teal)"/><text x="110" y="146" text-anchor="middle" font-size="12" fill="currentColor">aletas: o ar passa</text></svg>`;}
function mDiv(){return head(7,'Perfis Diversos · lambris e venezianas')+`<div class="sec"><h2>Lambris e venezianas</h2><p class="nt">Perfis que fecham a folha no lugar do vidro.</p>
 <div class="grid2"><div class="fig">${divSvg('lam')}<b>Lambril</b><small class="mute">Fechamento liso, sem ventilação</small></div><div class="fig">${divSvg('ven')}<b>Veneziana</b><small class="mute">Aletas inclinadas que deixam o ar passar e seguram a chuva</small></div></div>
 <p class="dica">💡 Veneziana é muito usada em área de serviço e casa de máquinas; lambril, onde se quer privacidade total.</p></div>`+
 quiz([['Qual a diferença entre lambril e veneziana?',['Veneziana ventila; lambril é fechado','Lambril ventila; veneziana é fechada','São a mesma coisa'],0,'A veneziana tem aletas que deixam o ar passar.']])+foot(7);}

/* =========================== 09 · Fachadas =========================== */
function mFac(){return head(8,'Fachadas · Linha FC Fachadas')+`<div class="sec"><div class="grid2">
 <div><div class="fig">${desenho('cor')}</div><h3 style="margin-top:10px">Fachada Cortina</h3><p style="margin-top:4px">Colunas e travessas aparentes, com o vidro preso por presilha e tampa externa. Do lado de fora, a grade de perfis aparece.</p><a class="btn pri" style="margin-top:10px" href="../obra/?t=cortina" target="_blank" rel="noopener">🧊 Abrir em 3D</a></div>
 <div><div class="fig">${desenho('atl')}</div><h3 style="margin-top:10px">Pele de Vidro Atlanta</h3><p style="margin-top:4px">Quadros colados no vidro e presos nas colunas por presilha. Do lado de fora só aparece o vidro.</p><a class="btn pri" style="margin-top:10px" href="../obra/?t=atlanta" target="_blank" rel="noopener">🧊 Abrir em 3D</a></div></div>
 <p class="dica">💡 No 3D das fachadas você digita as medidas da obra e monta a fachada na hora, para mostrar ao cliente. Os cálculos são uma simulação.</p></div>`+
 quiz([['Na Pele de Vidro Atlanta, o que aparece do lado de fora?',['Só o vidro','A grade de colunas e travessas','A tampa externa'],0,'Na Atlanta os quadros são colados no vidro; o perfil não aparece por fora.'],
  ['Na Fachada Cortina, como o vidro é preso?',['Por presilha e tampa externa','Só com silicone','Com braço'],0,'Na Cortina, presilha e tampa externa seguram o vidro.']])+foot(8);}

/* =========================== Prova final =========================== */
function mQuiz(){const Q=[
 ['Quando a esquadria é instalada no contramarco?',['Depois que o contramarco está chumbado e a obra pronta','Antes de chumbar','Junto com o reboco'],0,'O contramarco vem primeiro; a esquadria entra com a obra acabada.'],
 ['Para que serve o esquadro do contramarco?',['Manter o requadro em 90° durante a obra','Prender o vidro','Vedar a água'],0,'Sai depois que a argamassa cura.'],
 ['Vidro mais grosso pede guarnição…',['Mais fina','Mais grossa','Igual'],0,'O canal é o mesmo; sobra menos folga.'],
 ['Qual perfil é o trilho superior da janela de correr 2 folhas FC?',['SU-001','SU-002','SU-053'],0,'SU-001 superior; SU-002 inferior.'],
 ['Na janela 4 folhas, quais folhas correm?',['As duas do meio, para as laterais','Só uma','Todas para o mesmo lado'],0,'As centrais correm para as laterais.'],
 ['O que define o braço da maxim-ar?',['A altura da folha','A largura do vão','A cor'],0,'Braço é escolhido pela altura da folha.'],
 ['Que roldana corre no trilho macarrão?',['Côncava','Plana','Nenhuma'],0,'A roldana côncava encaixa no trilho do piso.'],
 ['Porta de giro a 45°: como os cantos são unidos?',['Meia-esquadria com cantoneira e cunha','Corte reto com parafuso','Só dobradiça'],0,'No 90° é corte reto e parafuso.'],
 ['Qual perfil deixa o ar passar?',['Veneziana','Lambril','Baguete'],0,'A veneziana tem aletas.'],
 ['Na Pele de Vidro Atlanta, o perfil aparece por fora?',['Não, só o vidro aparece','Sim, a grade inteira','Só as travessas'],0,'Quadros colados no vidro.']];
 const r=LSg('pfc-ori-prova',null);
 return `<div class="mh"><div class="ey">Encerramento</div><h1>✓ Prova final</h1><p>10 perguntas sobre todo o passo a passo.${r?` Último resultado: <b>${r.a}/10</b> em ${esc(r.d)}.`:''}</p></div>`+quiz(Q,'Prova final')+`<div class="foot"><button class="btn" data-go="fac">← Fachadas</button><button class="btn pri" id="qzRes">Ver meu resultado</button></div><div class="sec" id="qzOut" hidden></div>`;}

/* ---------- navegação ---------- */
function home(){const G=LSg('pfc-ori-prova',null);return `<div class="hero"><div class="ey">Plataforma FC 3D · Orientativo</div><h1>Orientativo 3D<br>Passo a passo</h1><p>Para a equipe aprender cada tipologia antes de apresentar: modelos, contramarco, guarnições, correr em 3D com os perfis reais, maxim-ar, componentes padrão, porta de giro, perfis diversos e fachadas. Cada módulo termina com um teste rápido.</p>
 <div class="row" style="margin-top:16px"><button class="btn am" data-go="${(MOD.find(m=>!FEITO.has(m.id))||MOD[0]).id}">${FEITO.size?'▶ Continuar':'▶ Começar'}</button><button class="btn" data-go="quiz" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.5)">✓ Prova final${G?' · '+G.a+'/10':''}</button></div></div>
 <div class="mg">${MOD.map((m,k)=>`<button class="mc ${FEITO.has(m.id)?'ok':''}" data-go="${m.id}"><span class="n">${FEITO.has(m.id)?'✓':String(k+1).padStart(2,'0')}</span><div><b>${esc(m.n)}</b><small>${esc(m.d)}</small></div></button>`).join('')}</div>
 <p class="aviso">Conteúdo orientativo da FC Consultoria em Esquadria. Medidas, pesos e componentes devem ser confirmados com o fornecedor da empresa. Cálculos sempre como simulação.</p>`;}
const RT={tip:mTip,cm:mCm,gua:mGua,cor:mCor,max:mMax,pad:mPad,giro:mGiro,div:mDiv,fac:mFac,quiz:mQuiz};
function go(id,keep){if(V3){V3.fim();V3=null;}AT=id&&RT[id]?id:null;$('#main').innerHTML=AT?RT[AT]():home();navUI();
 if(AT==='cor')liga3d();
 if(!keep)scrollTo({top:0,behavior:'smooth'});try{history.replaceState(null,'',location.pathname+location.search+(AT?'#'+AT:''));}catch(_){}}
function re(){const y=scrollY;go(AT,true);scrollTo(0,y);}

function iniciar(){
 document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return;}
  const f=e.target.closest('[data-feito]');if(f){const id=f.dataset.feito;FEITO.has(id)?FEITO.delete(id):FEITO.add(id);LSs('pfc-ori-feito',[...FEITO]);
   if(FEITO.has(id)){const k=MOD.findIndex(m=>m.id===id);go(MOD[k+1]?MOD[k+1].id:'quiz');}else re();return;}
  const o=e.target.closest('.op [data-o]');if(o){const q=o.closest('.q'),r=+q.dataset.r;q.querySelectorAll('[data-o]').forEach(b=>{b.disabled=true;b.classList.remove('certo','errado');if(+b.dataset.o===r)b.classList.add('certo');});if(+o.dataset.o!==r)o.classList.add('errado');q.querySelector('.ex').hidden=false;q.dataset.ok=+o.dataset.o===r?'1':'0';return;}
  const ts=e.target.closest('[data-tsel]');if(ts){TSEL=ts.dataset.tsel;re();return;}
  const ck=e.target.closest('[data-cmk]');if(ck){CMK=+ck.dataset.cmk;re();return;}
  const ge=e.target.closest('[data-ge]');if(ge){GE=+ge.dataset.ge;re();return;}
  const cr=e.target.closest('[data-crk]');if(cr){CRK=cr.dataset.crk;CRA=false;const y=scrollY;const fig=$('#crFig');if(fig){/* troca só a parte das folhas, sem recarregar o 3D */
    document.querySelectorAll('[data-crk]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.crk===CRK));const T=CR.find(c=>c[0]===CRK);fig.innerHTML=correrSvg(CRK,false);const tx=fig.nextElementSibling;tx.querySelector('h3').textContent=T[1];tx.querySelector('p').textContent=T[2];tx.querySelector('[data-cra]').textContent='↔ Abrir';}scrollTo(0,y);return;}
  const ca=e.target.closest('[data-cra]');if(ca){CRA=!CRA;const fig=$('#crFig');fig.querySelectorAll('g.anim').forEach(()=>{});const ns=correrSvg(CRK,CRA);/* anima: aplica os transforms nas folhas existentes */
    const tmp=document.createElement('div');tmp.innerHTML=ns;const novos=tmp.querySelectorAll('g.anim');fig.querySelectorAll('g.anim').forEach((gg,i)=>{if(novos[i])gg.style.transform=novos[i].style.transform;});const t=fig.querySelector('text');if(t)t.textContent=(CRA?'aberta':'fechada')+' · vista de dentro';ca.textContent=CRA?'⟲ Fechar':'↔ Abrir';return;}
  const c3=e.target.closest('[data-cr3]');if(c3){CR3=c3.dataset.cr3;SELC=null;re();return;}
  const pf=e.target.closest('[data-pf]');if(pf&&V3){const c=pf.dataset.pf;V3.marca(SELC===c?null:c);return;}
  if(e.target.id==='qzRes'){const qs=[...document.querySelectorAll('.q')],a=qs.filter(q=>q.dataset.ok==='1').length,fe=qs.filter(q=>q.dataset.ok!=null).length;const out=$('#qzOut');out.hidden=false;
   if(fe<qs.length){out.innerHTML=`<p>Responda todas as perguntas: faltam <b>${qs.length-fe}</b>.</p>`;return;}
   const d=new Date().toLocaleDateString('pt-BR');LSs('pfc-ori-prova',{a,d});out.innerHTML=`<div class="res">${a}/10</div><p>${a>=8?'Ótimo! A equipe está pronta para apresentar.':a>=6?'Bom resultado. Revise os módulos das perguntas que errou.':'Vale refazer os módulos e tentar de novo.'}</p>`;navUI();}
 });
 document.addEventListener('input',e=>{
  if(e.target.id==='mxR'){MXA=+e.target.value;$('#mxFig').innerHTML=maxSvg(MXA);$('#mxT').textContent=MXA+'°';}
  if(e.target.id==='grR'){GA=+e.target.value;$('#grFig').innerHTML=giroSvg(GA);$('#grT').textContent=GA+'°';}
 });
 addEventListener('keydown',e=>{if(e.key==='Escape'){const w=$('#v3w.fs');if(w){w.classList.remove('fs');$('#b3Fs').textContent='⛶ Tela cheia';}}});
 $('#bHome').onclick=()=>go(null);
 const h=location.hash.slice(1);go(RT[h]?h:null,true);
 addEventListener('hashchange',()=>{const k=location.hash.slice(1);if((RT[k]?k:null)!==AT)go(RT[k]?k:null);});
 fetch('../tecnico/secoes.json?v=2').then(r=>r.json()).then(j=>{SEC=SEC||j;}).catch(()=>{});
}
})();
</script>
