<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Catálogo de perfis</title>
<script>
/* Link curto dos catálogos (/catalogo/nome-do-cliente): carrega sempre a versão atual de /catalogo/index.html,
   assim existe uma página só para manter. Fora de /catalogo/ volta para o site. */
(function(){if(!/^\/catalogo\/[^\/]+/.test(location.pathname)){location.replace('/');return;}
 fetch('/catalogo/index.html',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.text();}).then(h=>{document.open();document.write(h);document.close();})
 .catch(()=>{location.replace('/catalogo/?c='+encodeURIComponent(location.pathname.split('/')[2]||''));});})();
</script></head><body></body></html>
